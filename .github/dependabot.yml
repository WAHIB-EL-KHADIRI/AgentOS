version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust

  - package-ecosystem: npm
    directory: /crates/sdk/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - typescript
    groups:
      sdk-ts:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
      frontend-tooling:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "vite"
          - "vitest"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pip
    directory: /crates/sdk/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # Actions are pinned to commit SHAs, which never move on their own.
  # This is what keeps a pin from sitting on a known-vulnerable version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      # codeql-action/init and codeql-action/analyze refuse to run at
      # different versions: analyze aborts with "Loaded a configuration file
      # for version X, but running version Y". Ungrouped, Dependabot opens one
      # pull request per action, and each is a version mismatch on its own, so
      # neither can ever go green. Grouping them is not tidiness, it is the
      # only way a bump of this action can pass CI.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Base images carry OS-level CVEs; nothing was watching them.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    # Node's odd-numbered majors never become LTS, so an unattended major
    # bump can move the image off a supported line - which is how this
    # Dockerfile ended up on 26. Majors are a deliberate choice here.
    # Patch and minor updates still flow, and those are what carry the
    # CVE fixes this ecosystem was added for.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
