name: Fuzz

# Short fuzzing runs against the network-facing parsers.
#
# This is deliberately not part of CI on every pull request: a 60-second run
# finds shallow panics, and anything deeper needs minutes, not seconds. It runs
# weekly so regressions surface without slowing down normal development, and it
# can be triggered by hand before a release.
#
# A crash here is a remote denial of service, not a style issue - the input is
# whatever an unauthenticated client sends to the bus socket.

on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds to run each target
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ws_message]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # cargo-fuzz requires nightly: libFuzzer needs -Z build-std style flags
      # and sanitizer support that stable does not expose.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.duration || 60 }} \
            -rss_limit_mb=2048

      # A crash file is a reproducer for a real defect: keep it.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
