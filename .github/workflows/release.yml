name: Release

on:
  push:
    tags: ["v*.*.*"]

# Deny by default; each job below grants only the scopes it needs.
# This workflow publishes binaries and images, so an over-scoped token here is
# the highest-value target in the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_cc: aarch64-linux-gnu-gcc
            cross_apt_package: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These are the binaries people download, so which compiler built them is
      # part of what the attestation below is asserting. dtolnay/rust-toolchain
      # exports RUSTUP_TOOLCHAIN, which rustup resolves ahead of
      # `rust-toolchain.toml` -- the release would have been built by whatever
      # `stable` meant that day, not by the pinned release the tests ran on.
      - name: Install the pinned toolchain
        run: rustup show

      - name: Verify the active toolchain matches the pin
        uses: ./.github/actions/verify-toolchain

      # The cross target has to be added to the *active* (pinned) toolchain.
      # Installing it into `stable` instead leaves `cargo build --target
      # aarch64-*` failing with the target missing the moment stable moves
      # past the pin.
      # `shell: bash` is required, not cosmetic: without it the Windows runner
      # runs this in PowerShell, where `"$TARGET"` is a literal string rather
      # than the environment variable, so rustup is asked for target '' and the
      # job fails. The env indirection stays -- matrix.target is trusted here,
      # but the pattern is what keeps `run:` bodies free of expansions.
      - name: Add the target to the pinned toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      # No build cache here, deliberately. GitHub Actions caches are writable
      # from other branches, so a poisoned entry could be restored into the job
      # that produces the signed, attested binaries people download. Release
      # builds are cold builds; the extra minutes buy an artifact whose inputs
      # came only from this commit. CI keeps its cache -- it publishes nothing.

      # Only the arm64-on-x86_64 cross target needs this: rustls's crypto
      # backend (ring) compiles small C/asm shims for the target arch, which
      # needs a real cross C toolchain even though there's no system OpenSSL
      # dependency anymore. Every other target in this matrix builds natively.
      - name: Install cross C toolchain
        if: matrix.cross_apt_package
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_apt_package }}

      - name: Build release
        env:
          CC_aarch64_unknown_linux_gnu: ${{ matrix.cross_cc }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_cc }}
        run: cargo build --release --target ${{ matrix.target }}

      # `github.ref_name` is the tag name: whoever can create a tag chooses
      # that string, and expanding it directly into a shell body executes it.
      # Passing through `env:` makes it a shell variable, which is data.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/agentOS" dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cd dist && tar czf "../agentOS-$REF_NAME-$TARGET.tar.gz" *

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path "target/$env:TARGET/release/agentOS.exe" -Destination dist/
          Copy-Item -Path README.md,LICENSE-MIT,LICENSE-APACHE -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "agentOS-$env:REF_NAME-$env:TARGET.zip"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: agentOS-${{ github.ref_name }}-${{ matrix.target }}.*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentOS-${{ matrix.target }}
          path: agentOS-${{ github.ref_name }}-${{ matrix.target }}.*

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentOS-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum agentOS-* > checksums.txt
          else
            shasum -a 256 agentOS-* > checksums.txt
          fi

      - name: Check release notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: test -f "docs/releases/$REF_NAME.md"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            agentOS-*
            checksums.txt
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: false

  publish-docker:
    name: Publish Docker Images
    needs: [build-binaries]
    if: ${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Supervisor image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: supervisor
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}-supervisor
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}-runtime
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dashboard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./dashboard
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}-dashboard
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
