name: Scorecard supply-chain security

# OpenSSF Scorecard grades this repo's security posture (branch protection,
# pinned dependencies, code review, token permissions, dangerous workflow
# patterns, ...) and publishes the result to the public Scorecard API so the
# README badge stays current. Third-party actions are pinned to a commit SHA;
# GitHub-owned actions use version tags, matching this repo's convention.
on:
  branch_protection_rule:
  schedule:
    - cron: "27 5 * * 1"
  push:
    branches: [main]

# Least-privilege by default; jobs opt into the extra scopes they need.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write        # publish results to the Scorecard API (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
