name: Dependency Review

# Informational supply-chain check: surfaces vulnerable/newly-added dependencies
# in a PR summary comment. warn-only => never blocks merges (zero friction).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          warn-only: true
          fail-on-severity: critical
          comment-summary-in-pr: always
