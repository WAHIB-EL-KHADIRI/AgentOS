name: Dependency Review

# Informational supply-chain check: surfaces vulnerable/newly-added dependencies
# in a PR summary comment. warn-only => never blocks merges (zero friction).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          warn-only: true
          fail-on-severity: critical
          comment-summary-in-pr: always
