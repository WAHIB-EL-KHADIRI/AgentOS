name: Dependency Review

# Two jobs, deliberately separate: one gate, one report.
#
#   dependency-review  -- BLOCKING. Required by branch protection on main.
#                         Fails a pull request that introduces a dependency
#                         with a known CRITICAL vulnerability.
#   dependency-report  -- NON-BLOCKING. Lists every finding from `low` up, in
#                         the job summary, and can never fail the build.
#
# They are split because tightening one must never silently loosen the other.
# Making the gate blocking (#178) had exactly that side effect: in warn-only
# mode the action ignores `fail-on-severity` and scans at the lowest level so
# it can report everything, so turning warn-only off narrowed the *report* to
# `critical` as well as the gate. `high` and `medium` findings stopped being
# blocking, which was intended, and stopped being visible, which was not (#180).
#
# The severity policy stays at `critical`. Enforcement and policy are separate
# decisions; tightening the threshold is its own change, with its own argument.
on:
  pull_request:
    branches: [main]

# Denied by default; each job opts into only what it needs.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          warn-only: false
          fail-on-severity: critical
          comment-summary-in-pr: always

  dependency-report:
    name: Dependency Report (non-blocking)
    runs-on: ubuntu-latest
    # No pull-requests: write. The gate above already posts one PR comment;
    # a second would be noise, so this one reports to the job summary only.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review (report only)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # warn-only already forces a scan at the lowest level and suppresses
          # the non-zero exit. fail-on-severity is stated anyway so the intent
          # survives if that behaviour ever changes.
          warn-only: true
          fail-on-severity: low
          comment-summary-in-pr: never
