name: Dependency Review

# Informational supply-chain check: surfaces vulnerable/newly-added dependencies
# in a PR summary comment. warn-only => never blocks merges (zero friction).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          warn-only: true
          fail-on-severity: critical
          comment-summary-in-pr: always
