name: Dependency Review

# Blocking supply-chain gate: fails a pull request that introduces a dependency
# with a known critical vulnerability, and summarises every dependency change
# in a PR comment.
#
# This check is required by branch protection on main. It was previously
# warn-only, which meant it reported findings but always reported success --
# a required check that can never fail protects nothing.
#
# The severity policy is deliberately left at `critical`. Enforcement and
# policy are separate decisions; tightening the threshold is its own change.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          warn-only: false
          fail-on-severity: critical
          comment-summary-in-pr: always
