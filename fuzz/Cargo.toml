# Detached from the main workspace on purpose: cargo-fuzz needs a nightly
# toolchain and libFuzzer, and nothing here should affect `cargo build --workspace`.
[package]
name = "agentos-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.agentos-bus]
path = "../crates/bus"

[[bin]]
name = "ws_message"
path = "fuzz_targets/ws_message.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

# Keep this crate out of the parent workspace.
[workspace]
